<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>功能测试 · 广州地铁</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f2f6fc; color: #1f2b3c; }
        h1 { font-size: 20px; margin-bottom: 12px; }
        .summary { padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; font-weight: 600; font-size: 15px; }
        .summary.all-pass { background: #dcfce7; color: #166534; border-left: 4px solid #16a34a; }
        .summary.has-fail { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }
        .group { margin-bottom: 20px; }
        .group h2 { font-size: 14px; margin: 0 0 8px; color: #475569; letter-spacing: 0.5px; }
        .item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; font-size: 13px; line-height: 1.5; background: #fff; border: 1px solid #e2e8f0; }
        .item.pass .mark { color: #16a34a; font-weight: 700; flex-shrink: 0; }
        .item.fail { background: #fef2f2; border-color: #fecaca; }
        .item.fail .mark { color: #dc2626; font-weight: 700; flex-shrink: 0; }
        .detail { color: #94a3b8; margin-left: 6px; font-size: 12px; }
        .item.fail .detail { color: #b91c1c; }
    </style>
</head>
<body>
<h1>🧪 单元测试</h1>
<div id="summary"></div>
<div id="groups"></div>

<script src="../js/constants.js"></script>
<script src="../js/store.js"></script>
<script src="../js/pinyin.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/cache.js"></script>
<script src="../js/route/heap.js"></script>
<script src="../js/route/ui-render.js"></script>

<script>
    // ========== 简易断言框架 ==========
    const __groups = [];
    function group(name) {
        const g = { name, items: [] };
        __groups.push(g);
        return {
            eq(actual, expected, label) {
                const ok = JSON.stringify(actual) === JSON.stringify(expected);
                g.items.push({
                    ok, label,
                    detail: ok ? '' : `期望 ${JSON.stringify(expected)}，实际 ${JSON.stringify(actual)}`
                });
            },
            run(label, fn) {
                try {
                    const ret = fn();
                    g.items.push({ ok: true, label, detail: ret || '' });
                } catch (e) {
                    g.items.push({ ok: false, label, detail: e.message || String(e) });
                }
            }
        };
    }

    // ========== 1. timeStrToMinutes ==========
    {
        const t = group('timeStrToMinutes');
        t.eq(timeStrToMinutes('09:30'), 570,  "'09:30' → 570");
        t.eq(timeStrToMinutes('00:15'), 1455, "'00:15' → 1455（次日凌晨）");
        t.eq(timeStrToMinutes('01:59'), 1559, "'01:59' → 1559");
        t.eq(timeStrToMinutes('02:00'), 120,  "'02:00' → 120（不跨日）");
        t.eq(timeStrToMinutes('23:59'), 1439, "'23:59' → 1439");
        t.eq(timeStrToMinutes('——'), null,   "'——' → null");
        t.eq(timeStrToMinutes(null), null,   "null → null");
    }

    // ========== 2. minutesToDisplayStr ==========
    {
        const t = group('minutesToDisplayStr');
        t.eq(minutesToDisplayStr(570),  '09:30', '570 → 09:30');
        t.eq(minutesToDisplayStr(1455), '00:15', '1455 → 00:15');
        t.eq(minutesToDisplayStr(0),    '00:00', '0 → 00:00');
        t.eq(minutesToDisplayStr(null), '--:--', 'null → --:--');
    }

    // ========== 3. stationToPinyin ==========
    {
        const t = group('stationToPinyin');
        const cases = [
            ['大塘',        'datang',          'dt'],
            ['长湴',        'changban',        'cb'],
            ['杨箕',        'yangji',          'yj'],
            ['番禺广场',    'panyuguangchang', 'pygc'],
            ['区庄',        'ouzhuang',        'oz'],   // 词组表命中
            ['机场北（T2）', 'jichangbei',     'jcb'],  // 括号、T2 跳过
            ['虫雷 岗',     'leigang',         'lg'],   // 词组 + 空格跳过
        ];
        for (const [name, expPy, expAbbr] of cases) {
            const r = stationToPinyin(name);
            t.eq([r.py, r.abbr], [expPy, expAbbr], `${name} → py=${expPy} / abbr=${expAbbr}`);
        }
    }

    // ========== 4. escapeHtml ==========
    {
        const t = group('escapeHtml');
        t.eq(escapeHtml('<script>'),  '&lt;script&gt;',     '<script>');
        t.eq(escapeHtml('a&b'),       'a&amp;b',            'a&b');
        t.eq(escapeHtml('say "hi"'),  'say &quot;hi&quot;', 'say "hi"');
        t.eq(escapeHtml(null),        '',                   'null');
    }

    // ========== 5. getContrastColor ==========
    {
        const t = group('getContrastColor');
        t.eq(getContrastColor('#ffffff'), '#000000', '#ffffff → 黑字');
        t.eq(getContrastColor('#000000'), '#ffffff', '#000000 → 白字');
        t.eq(getContrastColor('#f3d03e'), '#000000', '1号线黄 → 黑字');
        t.eq(getContrastColor('#00629b'), '#ffffff', '2号线蓝 → 白字');
    }

    // ========== 6. getGrayscaleColor ==========
    {
        const t = group('getGrayscaleColor');
        t.eq(getGrayscaleColor('#ffffff'), '#ffffff', '#ffffff → #ffffff');
        t.eq(getGrayscaleColor('#000000'), '#000000', '#000000 → #000000');
        t.eq(getGrayscaleColor('#ff0000'), '#4c4c4c', '#ff0000 → #4c4c4c');
    }

    // ========== 7. formatDuration ==========
    {
        const t = group('formatDuration');
        t.eq(formatDuration(90),   '1分30秒',     '90 → 1分30秒');
        t.eq(formatDuration(3600), '1小时0分0秒', '3600 → 1小时0分0秒');
        t.eq(formatDuration(45),   '45秒',        '45 → 45秒');
        t.eq(formatDuration(65),   '1分5秒',      '65 → 1分5秒');
    }

    // ========== 8. getServiceDate（运营日 5:00 分界） ==========
    {
        const t = group('getServiceDate');
        t.eq(getServiceDate(new Date('2026-10-17T04:30:00')), '2026-10-16', '04:30 → 前一日');
        t.eq(getServiceDate(new Date('2026-10-17T05:00:00')), '2026-10-17', '05:00 → 当日');
        t.eq(getServiceDate(new Date('2026-10-17T23:59:00')), '2026-10-17', '23:59 → 当日');
    }

    // ========== 9. MinHeap ==========
    {
        const t = group('MinHeap');
        t.run('push/pop 顺序', () => {
            const h = new MinHeap();
            h.push('a', 3);
            h.push('b', 1);
            h.push('c', 2);
            const x = h.pop(), y = h.pop(), z = h.pop();
            if (x.node !== 'b' || x.key !== 1) throw new Error(`第 1 次应 b(1)，实际 ${x.node}(${x.key})`);
            if (y.node !== 'c' || y.key !== 2) throw new Error(`第 2 次应 c(2)，实际 ${y.node}(${y.key})`);
            if (z.node !== 'a' || z.key !== 3) throw new Error(`第 3 次应 a(3)，实际 ${z.node}(${z.key})`);
            return '顺序正确';
        });
        t.run('空堆 pop 返回 null', () => {
            const h = new MinHeap();
            if (h.pop() !== null) throw new Error('应返回 null');
            return '返回 null';
        });
    }

    // ========== 渲染结果 ==========
    (function render() {
        let totalPass = 0, totalFail = 0;
        const groupsEl = document.getElementById('groups');
        for (const g of __groups) {
            const div = document.createElement('div');
            div.className = 'group';
            const h2 = document.createElement('h2');
            h2.textContent = g.name;
            div.appendChild(h2);

            for (const item of g.items) {
                item.ok ? totalPass++ : totalFail++;
                const row = document.createElement('div');
                row.className = 'item ' + (item.ok ? 'pass' : 'fail');
                row.innerHTML =
                    `<span class="mark">${item.ok ? '✓' : '✗'}</span>` +
                    `<span>${escapeHtml(item.label)}</span>` +
                    (item.detail ? `<span class="detail">${escapeHtml(item.detail)}</span>` : '');
                div.appendChild(row);
            }
            groupsEl.appendChild(div);
        }

        const sum = document.getElementById('summary');
        const allPass = totalFail === 0;
        sum.className = 'summary ' + (allPass ? 'all-pass' : 'has-fail');
        sum.textContent = allPass
            ? `✓ 全部通过（${totalPass} 项）`
            : `✗ ${totalFail} 项失败 / 共 ${totalPass + totalFail} 项`;
    })();
</script>
</body>
</html>
