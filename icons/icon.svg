<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
    <rect width="192" height="192" rx="38" fill="#ffffff"/>

    <!-- 环绕彩色线路：四色拼接成一个圆角矩形回路 -->
    <g fill="none" stroke-linecap="round" stroke-width="4.5">
        <!-- 橙 · 3号线：左上圆角 + 顶边 + 右上圆角前半 -->
        <path d="M 45.86 45.86 A 20 20 0 0 1 60 40 L 132 40 A 20 20 0 0 1 146.14 45.86"
              stroke="#eca154"/>
        <!-- 绿 · 4号线：右上圆角后半 + 右边 + 右下圆角前半 -->
        <path d="M 146.14 45.86 A 20 20 0 0 1 152 60 L 152 132 A 20 20 0 0 1 146.14 146.14"
              stroke="#00843d"/>
        <!-- 红 · 5号线：右下圆角后半 + 底边 + 左下圆角前半 -->
        <path d="M 146.14 146.14 A 20 20 0 0 1 132 152 L 60 152 A 20 20 0 0 1 45.86 146.14"
              stroke="#c5003e"/>
        <!-- 蓝 · 2号线：左下圆角后半 + 左边 + 左上圆角前半 -->
        <path d="M 45.86 146.14 A 20 20 0 0 1 40 132 L 40 60 A 20 20 0 0 1 45.86 45.86"
              stroke="#00629b"/>
    </g>

    <!-- 四条边中点：站点标记，实心/空心交替 -->
    <!-- 顶边：实心站（首班感），取边色 -->
    <circle cx="96" cy="40" r="7" fill="#eca154" stroke="#ffffff" stroke-width="3"/>
    <!-- 右边：空心站（末班感），白底 + 边色描边 -->
    <circle cx="152" cy="96" r="7" fill="#ffffff" stroke="#00843d" stroke-width="3"/>
    <!-- 底边：实心站 -->
    <circle cx="96" cy="152" r="7" fill="#c5003e" stroke="#ffffff" stroke-width="3"/>
    <!-- 左边：空心站 -->
    <circle cx="40" cy="96" r="7" fill="#ffffff" stroke="#00629b" stroke-width="3"/>

    <!-- 中央：广州地铁羊角 logo（居中） -->
    <g transform="translate(96, 96) scale(0.078) translate(-510,-530)" fill="#c5192d">
        <path d="M679.230234 158.727071c-131.554198 132.345214-139.739625 239.006466-139.739625 286.293445l0 418.578284 103.176894 0 0-376.306528c0 16.172331-0.022513 141.0382-0.022513-3.130294 0-185.234795 173.265182-325.434907 173.265182-325.434907L679.230234 158.727071 679.230234 158.727071z"/>
        <path d="M205.739293 158.727071c0 0 173.258019 140.201136 173.258019 325.434907 0 144.168494-0.01535 19.309788-0.01535 3.130294l0 376.306528 103.177917 0 0-418.578284c0-47.288003-8.17724-153.948231-139.741671-286.293445L205.739293 158.727071 205.739293 158.727071z"/>
    </g>
</svg>