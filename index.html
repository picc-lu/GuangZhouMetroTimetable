<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="广州地铁运营时间展示 - 实时查询广州地铁各线路首末班车时间，支持自定义时间模拟，含APM、佛山地铁等线路。">
    <meta name="keywords" content="广州地铁,运营时间,首末班车,广州地铁线路图,APM,佛山地铁">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="广州地铁运营时间展示">
    <meta property="og:description" content="实时查询广州地铁各线路首末班车时间，支持自定义时间模拟。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://picc-lu.github.io/GuangZhouMetroTimetable/">
    <title>广州地铁 · 运营时间展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner">
    <!-- 广州地铁羊角标志（纯手工绘制SVG） -->
    <svg viewBox="0 0 200 200" width="32" height="32" class="metro-icon">
        <!-- 左侧羊角 -->
        <path d="M 75 180 C 75 110, 80 60, 45 30 L 65 30 C 90 60, 95 110, 95 180 Z" fill="currentColor"/>
        <!-- 右侧羊角 -->
        <path d="M 125 180 C 125 110, 120 60, 155 30 L 135 30 C 110 60, 105 110, 105 180 Z" fill="currentColor"/>
    </svg>
    <span>地铁运营时间展示</span>
</div>
<div class="controls">
    <div class="controls-row-1">
        <div class="time-panel" id="custom-time-panel">
            <label>⏱ 自定义</label>
            <select id="hour-select"></select>
            <span>:</span>
            <select id="minute-select"></select>
            <button id="apply-custom-time" class="action-button">应用</button>
        </div>
        <div class="system-time-area" id="system-time-panel">
            <span id="real-time-clock">--:--</span>
            <button id="use-system-time" class="action-button">应用系统时间</button>
        </div>
        <div class="filter-area">
            <label>🚉 筛选</label>
            <select id="line-filter" class="filter-select" multiple size="1"></select>
            <button id="select-all" class="action-button">全选</button>
            <button id="deselect-all" class="action-button">清空</button>
        </div>
        <div class="size-control">
            <label>📏 尺寸</label>
            <select id="size-select">
                <option value="65">最大</option>
                <option value="55">大</option>
                <option value="45" selected>中</option>
            </select>
        </div>
    </div>
    <div class="controls-row-2">
        <div class="file-group">
            <button id="fetch-data-btn" class="action-button" style="background:#2e7d32;">🚇 获取最新首末时间数据</button>
        </div>
        <div class="header-version" id="version-display">线路版本: 加载中…</div>
    </div>
    <div class="controls-row-3" id="line-buttons-row"></div>
</div>

<div class="map-wrapper" id="map-wrapper"></div>
<div class="notice-area">注意：①乘坐末班车时建议预留5分钟进站时间<br>②节假日首末班车以官方公布为准</div>

<!-- 新增：个人信息展示区 -->
<div class="author-footer">
    <a href="https://space.bilibili.com/586431" target="_blank" class="bilibili-link">
        <span class="bilibili-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M17.5 5.5l-1.5-1.5h-1l1.5 1.5h-9l1.5-1.5h-1l-1.5 1.5H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-10c0-1.1-.9-2-2-2h-1.5zM18 17H6v-8h12v8zM9 12h2v2H9v-2zm4 0h2v2h-2v-2z"/>
            </svg>
        </span>
        <span>B站 AB君小子</span>
    </a>
</div>

<!-- 数据文件 -->
<script src="广州地铁线路各站.js"></script>
<script src="广州地铁运营时间.js"></script>

<!-- 模块化JS文件（按顺序加载） -->
<script src="constants.js"></script>
<script src="utils.js"></script>
<script src="cache.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="render.js"></script>
<script src="time.js"></script>
<script src="main.js"></script>
</body>
</html>
