<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="广州地铁运营时间展示 - 实时查询广州地铁各线路首末班车时间，支持自定义时间模拟，含APM、佛山地铁等线路。">
    <meta name="keywords" content="广州地铁,运营时间,首末班车,广州地铁线路图,APM,佛山地铁">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="广州地铁·运营时间展示">
    <meta property="og:description" content="实时查询广州地铁各线路首末班车时间，支持自定义时间模拟。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://picc-lu.github.io/GuangZhouMetroTimetable/">
    <title>广州地铁·运营时间展示</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c5192d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="羊角时刻">

    <link rel="apple-touch-icon" href="icons/icon-384.png">
</head>
<body>
<div class="banner">
    <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"
         style="height: 40px; width: 40px;" fill="#FFFFFF">
        <path d="M679.230234 158.727071c-131.554198 132.345214-139.739625 239.006466-139.739625 286.293445l0 418.578284 103.176894 0 0-376.306528c0 16.172331-0.022513 141.0382-0.022513-3.130294 0-185.234795 173.265182-325.434907 173.265182-325.434907L679.230234 158.727071 679.230234 158.727071z"></path>
        <path d="M205.739293 158.727071c0 0 173.258019 140.201136 173.258019 325.434907 0 144.168494-0.01535 19.309788-0.01535 3.130294l0 376.306528 103.177917 0 0-418.578284c0-47.288003-8.17724-153.948231-139.741671-286.293445L205.739293 158.727071 205.739293 158.727071z"></path>
    </svg>
    <span>地铁运营时间展示</span>
</div>
<div class="controls">
    <div class="controls-row-1">
        <div class="time-panel" id="custom-time-panel">
            <label>⏱ 自定义</label>
            <select id="hour-select"></select>
            <span>:</span>
            <select id="minute-select"></select>
            <button id="apply-custom-time" class="action-button">应用</button>
        </div>
        <div class="system-time-area" id="system-time-panel">
            <span id="real-time-clock">--:--</span>
            <button id="use-system-time" class="action-button">应用系统时间</button>
        </div>
    </div>
    <div class="controls-row-1b">
        <div class="filter-area">
            <label>🚉 筛选</label>
            <select id="line-filter" class="filter-select" multiple size="1"></select>
            <button id="select-all" class="action-button">全选</button>
            <button id="deselect-all" class="action-button">清空</button>
        </div>
        <div class="search-wrapper" id="search-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索站点" autocomplete="off">
            <div class="search-results" id="search-results"></div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" title="切换到夜间模式">
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
        </button>
    </div>
    <div class="controls-row-2">
        <div class="file-group">
            <button id="fetch-data-btn" class="action-button" style="background:#2e7d32;">🚇 获取最新首末数据</button>
        </div>
        <div class="header-version" id="version-display">线路版本: 加载中…</div>
    </div>
    <div class="controls-row-3" id="line-buttons-row"></div>
</div>

<div class="map-wrapper" id="map-wrapper"></div>
<div class="notice-area">
    <div class="notice-item">乘坐末班车时建议预留 <b>5 分钟</b> 进站时间</div>
    <div class="notice-item warn">节假日首末班车 <b>官方API已实现</b> 无需手动计算</div>
</div>

<div class="copyright-notice">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M14.83 9.17a4 4 0 1 0 0 5.66"></path>
    </svg>
    地铁运营数据版权归 <b>广州地铁</b> 所有，本页面仅供查询参考
</div>

<!-- 新增：个人信息展示区 -->
<div class="author-footer">
    <a href="https://space.bilibili.com/586431" target="_blank" class="bilibili-link">
        <span class="bilibili-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M17.5 5.5l-1.5-1.5h-1l1.5 1.5h-9l1.5-1.5h-1l-1.5 1.5H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-10c0-1.1-.9-2-2-2h-1.5zM18 17H6v-8h12v8zM9 12h2v2H9v-2zm4 0h2v2h-2v-2z"/>
            </svg>
        </span>
        <span>B站 AB君小子</span>
    </a>
</div>

<!-- 回到顶部按钮 -->
<button id="back-to-top" class="back-to-top" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
</button>

<!-- 模块化JS文件（按顺序加载） -->
<script src="js/constants.js"></script>
<script src="data/GZCoords.js"></script>
<script src="js/coords.js"></script>
<script src="js/search.js"></script>
<script src="js/utils.js"></script>
<script src="js/cache.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/time.js"></script>
<script src="js/theme.js"></script>
<script src="js/main.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.warn('[SW] 注册失败:', err);
            });
        });
    }
</script>
</body>
</html>
