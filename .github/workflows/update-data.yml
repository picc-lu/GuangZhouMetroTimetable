name: Update Daily Metro Data
on:
  workflow_dispatch: # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Fetch Data
        run: node scripts/fetch_daily_data.js
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/daily-times.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update daily metro data"
          git push